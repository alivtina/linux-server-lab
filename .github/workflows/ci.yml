name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - name: Check repository
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './scripts'

      - name: Run tests
        run: ./tests/test-health-check.sh

      - name: Build artifact
        run: |
          mkdir -p build
          cp scripts/*.sh build/
          tar -czf linux-server-lab.tar.gz -C build .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-server-lab
          path: linux-server-lab.tar.gz

  self-hosted-test:
    runs-on: [self-hosted, Linux, X64, ubuntu-devops]

    steps:
      - name: Test self-hosted runner
        run: |
          echo "Running on self-hosted runner"
          echo "Hostname: $(hostname)"
          echo "Kernel: $(uname -r)"
          cat /etc/os-release
